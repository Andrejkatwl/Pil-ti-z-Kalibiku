<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedice Pilátů z Kalibiku</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🚙 Expedice Pilátů z Kalibiku</h1>

    <div class="card">

        <div id="type" class="type"></div>

        <h2 id="title">Načítám...</h2>

        <p id="description"></p>

        <div class="gps">
            <strong>GPS:</strong>
            <span id="gps"></span>
        </div>

    </div>

    <div class="buttons">

        <button id="prevBtn">⬅ Předchozí</button>

        <button id="navigateBtn">
            🧭 Navigovat
        </button>

        <button id="nextBtn">Další ➡</button>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
